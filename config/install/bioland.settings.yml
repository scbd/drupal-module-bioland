countries:
  - 'gt'
# NOTE: dmsm_config_base_url is deliberately NOT shipped here.
#
# The geography fetch reads its config API base URL from
# bioland.settings.dmsm_config_base_url. There is no fallback for it in code,
# and no default here either: any value shipped for every environment would
# have to be the dev host, which is exactly what the production guard must
# refuse - a fresh production install would then never fetch and would keep
# the seeded countries above forever. The key is deploy-time configuration.
#
# Set it per environment, either through config import / `drush cset
# bioland.settings dmsm_config_base_url https://...`, or through
# $settings['bioland_dmsm_config_base_url'] (or the
# BIOLAND_DMSM_CONFIG_BASE_URL environment variable), which
# bioland_update_9082() reads to seed the key on sites that lack it.
#
# On production the host must ALSO be named in dmsm_config_prod_host_allowlist,
# which likewise ships absent: no production host exists in code either, for the
# same reason. Seed it with $settings['bioland_dmsm_prod_host_allowlist'] (array
# or comma-separated), the BIOLAND_DMSM_PROD_HOST_ALLOWLIST environment
# variable, or `drush cset bioland.settings dmsm_config_prod_host_allowlist.0
# <host>`. Until it is set a production site refuses every fetch and says so on
# /admin/reports/status.
region: 'north_america'
is_biosafety_land: false
enable_field_visibility: true
field_visibility:
  url_content_types:
    - 2
    - 3
    - 4
    - 5
    - 8
    - 9
    - 10
    - 11
    - 12
    - 13
  published_content_types:
    - 3
    - 5
    - 12
  date_range_content_types:
    - 2
    - 4
    - 11
    - 13
enable_additional_fields: true
additional_tags:
  event_status_content_types:
    - 3
  project_status_content_types:
    - 5
  organization_types_content_types:
    - 8
  ecosystem_types_content_types:
    - 9
  document_types_content_types:
    - 12
enable_auto_summary: true
enable_help_comments: true
help_comments:
  body_text: 'This will be the main content of your new site content. The summary can be used to display a brief concise description of your content. Further, the summary will be displayed in list and card views of your record on the website. Alternatively, the first few sentences from the main content will be used.'
  body_text_translations: {}
  attachments_images_text: 'The first image in order of left to right here, will be the main image of your record displayed on the page and in thumbnails in list and card views. All other images will be displayed below the main content.'
  attachments_images_translations: {}
  attachments_heroes_text: 'Any page/content type can have multiple hero banners. If there is more than one they will be rotated on an hourly basis.'
  attachments_heroes_translations: {}
  home_hero_help_bsl_heading: 'About Home Page Heroe'
  home_hero_help_bsl_text: 'Heros are the large banner images displayed at the top of the home page. Since the home page layout cannot be directly edited, this is where you edit the hero banner for the home page.'
field_visibility_rules: ''
config:
  promote_and_sticky_public: true
google_analytics_enabled: false
google_analytics_ids: ''
enable_debug_logging: false
debug_log_areas:
  field_visibility: true
  additional_fields: true
  auto_summary: true
  help_comments: true
main_menu_lock: true
component_menu_add_enabled: true
component_menu_show_attributes: false
mega_menu:
