    hide_content_types: true
  country_profiles:
    position: 'top'
    show_if_empty: false
  focal_points:
    position: 'top'
    show_if_empty: false
  national_targets:
    position: 'top'
    show_if_empty: false
  national_report:
    position: 'top'
    show_if_empty: false
  bch:
    position: 'top'
    show_if_empty: false
  absch:
    position: 'top'
    show_if_empty: false
  forums:
    position: 'top'
    show_if_empty: false
translation:
  auto_create: true
  # Gates the translation backfill update hook, which writes translation
  # defaults across every existing content node. Ships off by design: enabling
  # it is a deliberate, per-site, operator-run act, never a deploy side effect.
  backfill_enabled: false
  use_all_languages: true
  target_languages: []
  copy_source_values: true
  entity_types:
    - node
