bioland.settings:
  type: config_object
  label: 'Bioland settings'
  mapping:
    countries:
      type: sequence
      label: 'Country codes'
      sequence:
        type: string
        label: 'ISO country code'
    region:
      type: string
      label: 'Geographic region'
    continent:
      type: string
      label: 'Continent'
    is_biosafety_land:
      type: boolean
      label: 'Is Biosafety Land'
    enable_field_visibility:
      type: boolean
      label: 'Enable field visibility control'
    field_visibility:
      type: mapping
      label: 'Field visibility settings'
      mapping:
        url_content_types:
          type: sequence
          label: 'Content types where URL field is visible'
          sequence:
            type: integer
            label: 'Content type ID'
        published_content_types:
          type: sequence
          label: 'Content types where Published field is visible'
          sequence:
            type: integer
            label: 'Content type ID'
        date_range_content_types:
          type: sequence
          label: 'Content types where Date Range fields (Start & End Date) are visible'
          sequence:
            type: integer
            label: 'Content type ID'
    enable_additional_fields:
      type: boolean
      label: 'Enable additional fields'
    additional_tags:
      type: mapping
      label: 'Additional tags settings (content type mappings are fixed, not site-configurable)'
      mapping:
        event_status_content_types:
          type: sequence
          label: 'Content types where Event Status tags are visible (fixed, not site-configurable)'
          sequence:
            type: integer
            label: 'Content type ID'
        project_status_content_types:
          type: sequence
          label: 'Content types where Project Status tags are visible (fixed, not site-configurable)'
          sequence:
            type: integer
            label: 'Content type ID'
        organization_types_content_types:
          type: sequence
          label: 'Content types where Organization Types tags are visible (fixed, not site-configurable)'
          sequence:
            type: integer
            label: 'Content type ID'
        ecosystem_types_content_types:
          type: sequence
          label: 'Content types where Ecosystem Types tags are visible (fixed, not site-configurable)'
          sequence:
            type: integer
            label: 'Content type ID'
        document_types_content_types:
          type: sequence
          label: 'Content types where Document Types tags are visible (fixed, not site-configurable)'
          sequence:
            type: integer
            label: 'Content type ID'
    enable_auto_summary:
      type: boolean
      label: 'Enable auto summary'
    enable_help_comments:
      type: boolean
      label: 'Enable field help comments'
    help_comments:
      type: mapping
      label: 'Help comments settings'
      mapping:
        body_text:
          type: text
          label: 'Body field help text'
        body_text_format:
          type: string
          label: 'Body field help text format'
        body_text_translations:
          type: mapping
          label: 'Body help text translations'
        body_text_translations_format:
          type: mapping
          label: 'Body help text translations formats'
        attachments_images_text:
          type: text
          label: 'Attachments images help text'
        attachments_images_text_format:
          type: string
          label: 'Attachments images help text format'
        attachments_images_translations:
          type: mapping
          label: 'Attachments images help text translations'
        attachments_images_translations_format:
          type: mapping
          label: 'Attachments images help text translations formats'
        attachments_heroes_text:
          type: text
          label: 'Attachments heroes help text'
        attachments_heroes_text_format:
          type: string
          label: 'Attachments heroes help text format'
        attachments_heroes_translations:
          type: mapping
          label: 'Attachments heroes help text translations'
        attachments_heroes_translations_format:
          type: mapping
          label: 'Attachments heroes help text translations formats'
        home_hero_help_bsl_heading:
          type: text
          label: 'Home page hero help heading (Biosafety Land variant)'
        home_hero_help_bsl_text:
          type: text
          label: 'Home page hero help body (Biosafety Land variant)'
        promotion_text:
          type: text
          label: 'Promotion options help text'
        promotion_text_format:
          type: string
          label: 'Promotion options help text format'
        promotion_translations:
          type: mapping
          label: 'Promotion options help text translations'
        promotion_translations_format:
          type: mapping
          label: 'Promotion options help text translations formats'
        order_override_text:
          type: text
          label: 'Order override help text'
        order_override_text_format:
          type: string
          label: 'Order override help text format'
        order_override_translations:
          type: mapping
          label: 'Order override help text translations'
        order_override_translations_format:
          type: mapping
          label: 'Order override help text translations formats'
    field_visibility_rules:
      type: text
      label: 'Field visibility rules (JSON)'
    config:
      type: mapping
      label: 'Configuration settings'
      mapping:
        promote_and_sticky_public:
          type: boolean
          label: 'Show Promote and Sticky flags to public users'
    enable_debug_logging:
      type: boolean
      label: 'Enable debug logging'
    debug_log_areas:
      type: mapping
      label: 'Debug log areas'
      mapping:
        field_visibility:
          type: boolean
          label: 'Log field visibility'
        additional_fields:
          type: boolean
          label: 'Log additional fields'
        auto_summary:
          type: boolean
          label: 'Log auto summary'
        help_comments:
          type: boolean
          label: 'Log help comments'
    main_menu_lock:
      type: boolean
      label: 'Lock main menu editing'
    component_menu_add_enabled:
      type: boolean
      label: 'Enable component menu links'
    component_menu_show_attributes:
      type: boolean
      label: 'Show the Attributes section on component menu link forms'
    mega_menu:
      type: mapping
      label: 'Mega menu settings'
      mapping:
        content_type_menus:
          type: mapping
          label: 'Content type menu configurations'
          mapping:
            visible_content_type_menus:
              type: sequence
              label: 'Cached visible content type menu TIDs'
              sequence:
                type: integer
                label: 'Content type TID'
            '*':
              type: mapping
              label: 'Content type menu settings'
              mapping:
                max_menus:
                  type: integer
                  label: 'Maximum menus to show'
                menu_position:
                  type: string
                  label: 'Menu position'
                show_if_empty:
                  type: boolean
                  label: 'Show menu even if empty'
        content_types:
          type: mapping
          label: 'Content types settings'
          mapping:
            position:
              type: string
              label: 'Menu position'
            hide_content_types:
              type: boolean
              label: 'Hide content types in mega menu'
        country_profiles:
          type: mapping
          label: 'Country Profiles Menu settings'
          mapping:
            position:
              type: string
              label: 'Menu position'
            show_if_empty:
              type: boolean
              label: 'Show menu even if empty'
        focal_points:
          type: mapping
          label: 'Focal Points Menu settings'
          mapping:
            position:
              type: string
              label: 'Menu position'
            show_if_empty:
              type: boolean
              label: 'Show menu even if empty'
        national_targets:
          type: mapping
          label: 'National Targets Menu settings'
          mapping:
            position:
              type: string
              label: 'Menu position'
            show_if_empty:
              type: boolean
              label: 'Show menu even if empty'
        national_report:
          type: mapping
          label: 'National Report Menu settings'
          mapping:
            position:
              type: string
              label: 'Menu position'
            show_if_empty:
              type: boolean
              label: 'Show menu even if empty'
        bch:
          type: mapping
          label: 'BCH Menu settings'
          mapping:
            position:
              type: string
              label: 'Menu position'
            show_if_empty:
              type: boolean
              label: 'Show menu even if empty'
        absch:
          type: mapping
          label: 'ABSCH Menu settings'
          mapping:
            position:
              type: string
              label: 'Menu position'
            show_if_empty:
              type: boolean
              label: 'Show menu even if empty'
        forums:
          type: mapping
          label: 'Forums Menu settings'
          mapping:
            position:
              type: string
              label: 'Menu position'
            show_if_empty:
              type: boolean
              label: 'Show menu even if empty'
    home_widgets:
      type: mapping
      label: 'Home page widget settings'
      mapping:
        gbif_widget:
          type: mapping
          label: 'GBIF Widget settings'
          mapping:
            enable:
              type: boolean
              label: 'Enable GBIF Widget'
            countries:
              type: mapping
              label: 'Country-specific GBIF settings'
              mapping:
                '*':
                  type: mapping
                  label: 'Country GBIF settings'
                  mapping:
                    zoom_level:
                      type: integer
                      label: 'Map zoom level'
                    longitude:
                      type: float
                      label: 'Center point longitude'
                    latitude:
                      type: float
                      label: 'Center point latitude'
        latest_news_widget:
          type: mapping
          label: 'Latest News and Updates Widget settings'
          mapping:
            enable:
              type: boolean
              label: 'Enable Latest News and Updates Widget'
        national_targets_widget:
          type: mapping
          label: 'National Targets Widget settings'
          mapping:
            enable:
              type: boolean
              label: 'Enable National Targets Widget'
        panorama_solutions_widget:
          type: mapping
          label: 'Panorama Solutions Widget settings'
          mapping:
            enable:
              type: boolean
              label: 'Enable Panorama Solutions Widget'
        elearning_widget:
          type: mapping
          label: 'E-Learning Widget settings'
          mapping:
            enable:
              type: boolean
              label: 'Enable E-Learning Widget'
        implementation_widget:
          type: mapping
          label: 'Implementation Widget settings'
          mapping:
            enable:
              type: boolean
              label: 'Enable Implementation Widget'
        technical_cooperation_widget:
          type: mapping
          label: 'Technical & Scientific Cooperation Widget settings'
          mapping:
            enable:
              type: boolean
              label: 'Enable Technical & Scientific Cooperation Widget'
        latest_discussions_widget:
          type: mapping
          label: 'Latest Discussions Widget settings'
          mapping:
            enable:
              type: boolean
              label: 'Enable Latest Discussions Widget'
        content_statistics_widget:
          type: mapping
          label: 'Content Statistics Widget settings'
          mapping:
            enable:
              type: boolean
              label: 'Enable Content Statistics Widget'
        geobon_widget:
          type: mapping
          label: 'GEOBON Widget settings'
          mapping:
            enable:
              type: boolean
              label: 'Enable GEOBON Widget'
        nbf_widget:
          type: mapping
          label: 'National Biosafety Framework Widget settings'
          mapping:
            enable:
              type: boolean
              label: 'Enable National Biosafety Framework Widget'
            content_types:
              type: sequence
              label: 'Content types shown in the National Biosafety Framework Widget'
              sequence:
                type: integer
                label: 'Content type term ID'
        bch_news_widget:
          type: mapping
          label: 'BCH News Widget settings'
          mapping:
            enable:
              type: boolean
              label: 'Enable BCH News Widget'
            content_types:
              type: sequence
              label: 'Content types searched by the BCH News Widget view more link'
              sequence:
                type: integer
                label: 'Content type term ID'
        bch_resources_widget:
          type: mapping
          label: 'BCH Resources Widget settings'
          mapping:
            enable:
              type: boolean
              label: 'Enable BCH Resources Widget'
            content_types:
              type: sequence
              label: 'Content types searched by the BCH Resources Widget view more link'
              sequence:
                type: integer
                label: 'Content type term ID'
    translation:
      type: mapping
      label: 'Translation settings'
      mapping:
        auto_create:
          type: boolean
          label: 'Automatically create translation defaults'
        use_all_languages:
          type: boolean
          label: 'Use all available languages'
        target_languages:
          type: sequence
          label: 'Target languages for translation defaults'
          sequence:
            type: string
            label: 'Language code'
        copy_source_values:
          type: boolean
          label: 'Copy source field values to translations'
        entity_types:
          type: sequence
          label: 'Entity types to auto-translate'
          sequence:
            type: string
            label: 'Entity type machine name'
