bioland.settings:
  type: config_object
  label: 'Bioland settings'
  mapping:
    countries:
      type: sequence
      label: 'Country codes'
      sequence:
        type: string
        label: 'ISO country code'
    region:
      type: string
      label: 'Geographic region'
    is_biosafety_land:
      type: boolean
      label: 'Is Biosafety Land'
    enable_field_visibility:
      type: boolean
      label: 'Enable field visibility control'
    field_visibility:
      type: mapping
      label: 'Field visibility settings'
      mapping:
        url_content_types:
          type: sequence
          label: 'Content types where URL field is visible'
          sequence:
            type: integer
            label: 'Content type ID'
        published_content_types:
          type: sequence
          label: 'Content types where Published field is visible'
          sequence:
            type: integer
            label: 'Content type ID'
        date_range_content_types:
          type: sequence
          label: 'Content types where Date Range fields (Start & End Date) are visible'
          sequence:
            type: integer
            label: 'Content type ID'
    enable_additional_fields:
      type: boolean
      label: 'Enable additional fields'
    enable_auto_summary:
      type: boolean
      label: 'Enable auto summary'
    enable_help_comments:
      type: boolean
      label: 'Enable field help comments'
    help_comments:
      type: mapping
      label: 'Help comments settings'
      mapping:
        body_text:
          type: text
          label: 'Body field help text'
        body_text_translations:
          type: mapping
          label: 'Body help text translations'
        attachments_images_text:
          type: text
          label: 'Attachments images help text'
        attachments_images_translations:
          type: mapping
          label: 'Attachments images help text translations'
        attachments_heroes_text:
          type: text
          label: 'Attachments heroes help text'
        attachments_heroes_translations:
          type: mapping
          label: 'Attachments heroes help text translations'
        promotion_text:
          type: text
          label: 'Promotion options help text'
        promotion_translations:
          type: mapping
          label: 'Promotion options help text translations'
    field_visibility_rules:
      type: text
      label: 'Field visibility rules (JSON)'
    enable_debug_logging:
      type: boolean
      label: 'Enable debug logging'
    debug_log_areas:
      type: mapping
      label: 'Debug log areas'
      mapping:
        field_visibility:
          type: boolean
          label: 'Log field visibility'
        additional_fields:
          type: boolean
          label: 'Log additional fields'
        auto_summary:
          type: boolean
          label: 'Log auto summary'
        help_comments:
          type: boolean
          label: 'Log help comments'
    translation:
      type: mapping
      label: 'Translation settings'
      mapping:
        auto_create:
          type: boolean
          label: 'Automatically create translation defaults'
        use_all_languages:
          type: boolean
          label: 'Use all available languages'
        target_languages:
          type: sequence
          label: 'Target languages for translation defaults'
          sequence:
            type: string
            label: 'Language code'
        copy_source_values:
          type: boolean
          label: 'Copy source field values to translations'
        entity_types:
          type: sequence
          label: 'Entity types to auto-translate'
          sequence:
            type: string
            label: 'Entity type machine name'
