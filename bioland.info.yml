name: Bioland
type: module
description: 'Handles settings for the Bioland tool including locales, countries, region, field visibility, additional fields, auto summary, and translation defaults functionality.'
package: SCBD
version: 1.1.1
core_version_requirement: ^10 || ^11
configure: bioland.settings
dependencies:
  - drupal:system
  - drupal:node
  - drupal:field
  - drupal:content_translation
  - drupal:language
  # Contrib modules required by Bioland. These must be present in the codebase
  # (installed via Composer) for Bioland to enable successfully.
  - drupal:auto_node_translate
  - drupal:auto_node_translate_deepl
  - drupal:auto_node_translate_amazon
  - drupal:ant_bulk
  - drupal:fontawesome
  - drupal:linkit
  - drupal:jsonapi_extras
