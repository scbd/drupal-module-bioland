services:
  bioland.settings_manager:
    class: Drupal\bioland\Service\BiolandSettingsManager
    arguments: ['@config.factory']
  
  bioland.field_functionality_manager:
    class: Drupal\bioland\Service\BiolandFieldFunctionalityManager
    arguments: ['@config.factory', '@language_manager']

  bioland.translation_manager:
    class: Drupal\bioland\Service\BiolandTranslationManager
    arguments: ['@config.factory', '@language_manager', '@logger.factory', '@entity_type.manager']

  bioland.translation_batch:
    class: Drupal\bioland\Service\BiolandTranslationBatchService
    arguments: ['@entity_type.manager', '@config.factory', '@bioland.translation_manager']

  bioland.dmsm_config:
    class: Drupal\bioland\Service\BiolandDmsmConfigService
    arguments: ['@config.factory', '@http_client', '@logger.factory']

  bioland.config_document_builder:
    class: Drupal\bioland\Service\BiolandConfigDocumentBuilder
    arguments: ['@logger.factory']

  bioland.config_api_access_check:
    class: Drupal\bioland\Access\BiolandConfigApiAccessCheck
    arguments: ['@settings']
    tags:
      - { name: access_check, applies_to: _bioland_config_api }
