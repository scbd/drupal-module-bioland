bioland.settings:
  path: '/admin/config/bioland/settings'
  defaults:
    _form: '\Drupal\bioland\Form\BiolandSettingsForm'
    _title_callback: '\Drupal\bioland\Form\BiolandSettingsForm::getTitle'
    section: 'general'
  requirements:
    _permission: 'administer bioland settings'

bioland.settings.field_visibility:
  path: '/admin/config/bioland/settings/field-visibility'
  defaults:
    _form: '\Drupal\bioland\Form\BiolandSettingsForm'
    _title: 'Field Visibility Settings'
    section: 'field_visibility'
  requirements:
    _permission: 'administer bioland field settings'

bioland.settings.translation:
  path: '/admin/config/bioland/settings/translation'
  defaults:
    _form: '\Drupal\bioland\Form\BiolandSettingsForm'
    _title: 'Translation Defaults'
    section: 'translation'
  requirements:
    _permission: 'administer bioland translation settings'

bioland.settings.tags:
  path: '/admin/config/bioland/settings/tags'
  defaults:
    _form: '\Drupal\bioland\Form\BiolandSettingsForm'
    _title: 'Tags'
    section: 'tags'
  requirements:
    _permission: 'administer bioland field settings'

bioland.settings.help_comments:
  path: '/admin/config/bioland/settings/help-comments'
  defaults:
    _form: '\Drupal\bioland\Form\BiolandSettingsForm'
    _title: 'Help Comments'
    section: 'help_comments'
  requirements:
    _permission: 'administer bioland field settings'

bioland.settings.configuration:
  path: '/admin/config/bioland/settings/configuration'
  defaults:
    _form: '\Drupal\bioland\Form\BiolandSettingsForm'
    _title: 'Configuration'
    section: 'configuration'
  requirements:
    _permission: 'administer bioland settings'

bioland.settings.configuration.general:
  path: '/admin/config/bioland/settings/configuration/general'
  defaults:
    _form: '\Drupal\bioland\Form\BiolandSettingsForm'
    _title: 'General'
    section: 'configuration_general'
  requirements:
    _permission: 'administer bioland settings'

bioland.settings.configuration.mega_menu:
  path: '/admin/config/bioland/settings/configuration/mega-menu'
  defaults:
    _form: '\Drupal\bioland\Form\BiolandSettingsForm'
    _title: 'Mega Menu'
    section: 'configuration_mega_menu'
  requirements:
    _permission: 'administer bioland settings'

bioland.settings.configuration.home_page:
  path: '/admin/config/bioland/settings/configuration/home-page'
  defaults:
    _form: '\Drupal\bioland\Form\BiolandSettingsForm'
    _title: 'Home Page'
    section: 'configuration_home_page'
  requirements:
    _permission: 'administer bioland settings'

bioland.settings.system_functions:
  path: '/admin/config/bioland/settings/system-functions'
  defaults:
    _form: '\Drupal\bioland\Form\BiolandSettingsForm'
    _title: 'System Functions'
    section: 'system_functions'
  requirements:
    _role: 'administrator'

bioland.settings.admin:
  path: '/admin/config/bioland/settings/admin'
  defaults:
    _form: '\Drupal\bioland\Form\BiolandSettingsForm'
    _title: 'Admin Settings'
    section: 'admin'
  requirements:
    _role: 'administrator'
