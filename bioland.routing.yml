  requirements:
    _permission: 'administer bioland settings'

bioland.settings.front_end.general:
  path: '/admin/config/bioland/settings/front-end/general'
  defaults:
    _form: '\Drupal\bioland\Form\BiolandFrontEndGeneralForm'
    _title: 'Front End General'
  requirements:
    _permission: 'administer bioland settings'

bioland.settings.front_end.mega_menu:
  path: '/admin/config/bioland/settings/front-end/mega-menu'
  defaults:
    _form: '\Drupal\bioland\Form\BiolandMegaMenuForm'
    _title: 'Mega Menu'
  requirements:
    _permission: 'administer bioland settings'

bioland.settings.front_end.home_page:
  path: '/admin/config/bioland/settings/front-end/home-page'
  defaults:
    _form: '\Drupal\bioland\Form\BiolandHomePageForm'
    _title: 'Home Page'
  requirements:
    _permission: 'administer bioland settings'

bioland.settings.front_end.home_widgets:
  path: '/admin/config/bioland/settings/front-end/home-widgets'
  defaults:
    _form: '\Drupal\bioland\Form\BiolandHomeWidgetsForm'
    _title: 'Home Widgets'
  requirements:
    _permission: 'administer bioland settings'

bioland.settings.system_functions:
  path: '/admin/config/bioland/settings/system-functions'
  defaults:
    _form: '\Drupal\bioland\Form\BiolandSystemFunctionsForm'
    _title: 'System Functions'
  requirements:
    _role: 'administrator'

bioland.settings.admin:
  path: '/admin/config/bioland/settings/admin'
  defaults:
    _form: '\Drupal\bioland\Form\BiolandAdminSettingsForm'
    _title: 'Admin Settings'
  requirements:
    _role: 'administrator'

# The dedicated "Add component menu link" flow. Deliberately a sibling of
# core's entity.menu.add_link_form rather than a replacement: the regular add
# path stays byte-identical. Access, parameters and _admin_route mirror that
# core route exactly, so this adds no new permission (see ADR 0005).
bioland.menu_link_component.add:
  path: '/admin/structure/menu/manage/{menu}/add-component'
  defaults:
    _controller: '\Drupal\bioland\Controller\BiolandMenuController::addComponentLink'
    _title: 'Add component menu link'
  requirements:
    _entity_create_access: 'menu_link_content'
  options:
    _admin_route: TRUE
    parameters:
      menu:
        type: 'entity:menu'
