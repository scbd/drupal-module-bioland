bioland.settings:
  path: '/admin/config/bioland/settings'
  defaults:
    _form: '\Drupal\bioland\Form\BiolandGeneralSettingsForm'
    _title_callback: '\Drupal\bioland\Form\BiolandGeneralSettingsForm::getTitle'
  requirements:
    _permission: 'administer bioland settings'

bioland.settings.field_visibility:
  path: '/admin/config/bioland/settings/field-visibility'
  defaults:
    _form: '\Drupal\bioland\Form\BiolandFieldVisibilityForm'
    _title: 'Field Visibility Settings'
  requirements:
    _permission: 'administer bioland field settings'

bioland.settings.tags:
  path: '/admin/config/bioland/settings/tags'
  defaults:
    _form: '\Drupal\bioland\Form\BiolandTagsForm'
    _title: 'Tags'
  requirements:
    _permission: 'administer bioland field settings'

bioland.settings.help_comments:
  path: '/admin/config/bioland/settings/help-comments'
  defaults:
    _form: '\Drupal\bioland\Form\BiolandHelpCommentsForm'
    _title: 'Help Comments'
  requirements:
    _permission: 'administer bioland field settings'

bioland.settings.front_end:
