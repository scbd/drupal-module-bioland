# PR Resolver Agent Configuration
# Version: 1.0.0
# Documentation: .github/agents/configuration-and-quality-gates.md

# =============================================================================
# REQUIRED SETTINGS
# =============================================================================

# Target branch for created PRs (e.g., master, main, develop)
baseBranch: master

# Branch containing commits to reorganize
# Can be overridden at runtime
sourceBranch: BL-605-alpha

# =============================================================================
# CHUNKING STRATEGY
# =============================================================================

chunking:
  # Strategy for grouping commits into PRs
  # Options: by_ticket | by_date | by_size
  strategy: by_ticket

  # Maximum commits per chunk/PR
  maxCommitsPerChunk: 50

  # Maximum files per PR
  maxFilesPerPr: 10

  # Maximum lines of code changed per PR
  maxLocPerPr: 400

  # For by_date strategy: group by week or sprint
  dateGrouping: week  # week | sprint

# =============================================================================
# SUB-AGENT CONFIGURATION
# =============================================================================

subAgents:
  # Primary sub-agent for task delegation
  primary: claude

  # Fallback agents in order of preference
  fallback:
    - codex
    - gemini

  # Timeout for sub-agent tasks (minutes)
  timeoutMinutes: 30

  # Agent specializations (used for task routing)
  specializations:
    claude:
      - documentation
      - pr-descriptions
      - architecture
    codex:
      - code-refactoring
      - conflict-resolution
      - complex-merges
    gemini:
      - code-analysis
      - metrics
      - quality-review

# =============================================================================
# OPERATION MODES
# =============================================================================

modes:
  # Dry-run mode: analyze and plan only, no branches or PRs created
  dryRun: true

  # Verbose logging
  verbose: true

  # Automatically create Jira tickets for orphan commits
  autoCreateJiraForOrphans: false

  # Force push to existing branches (dangerous!)
  allowForcePush: false

  # Interactive mode: prompt for confirmation at key steps
  interactive: false

# =============================================================================
# JIRA INTEGRATION
# =============================================================================

jira:
  # Enable Jira integration
  enabled: false

  # Project key for new tickets (if autoCreateJiraForOrphans is true)
  defaultProject: ""

  # Ticket type for auto-created tickets
  defaultIssueType: Task

  # Custom JQL filter for related tickets (optional)
  jqlFilter: ""

  # Fields to fetch from Jira
  fetchFields:
    - summary
    - status
    - type
    - priority
    - assignee
    - parent  # for sub-tasks
    - issuelinks  # for dependencies

# =============================================================================
# QUALITY GATES
# =============================================================================

qualityGates:
  # Require successful build before PR creation
  requireBuild: false

  # Require passing tests
  requireTests: false

  # Require lint to pass
  requireLint: false

  # Check for secrets/credentials in diffs
  checkSecrets: false

  # Require at least one linked Jira ticket
  requireJiraLink: true

  # Custom quality gate commands (optional)
  customChecks:
    # - name: "Security Scan"
    #   command: "npm run security-scan"
    #   required: false

# =============================================================================
# BRANCH NAMING
# =============================================================================

branches:
  # Pattern for feature branches
  # Placeholders: {ticket}, {date}, {index}
  featurePattern: "feature/{ticket}-reorganized"

  # Pattern for backup branches
  backupPattern: "backup/reorganization-{timestamp}"

  # Delete feature branches after PR merge
  cleanupAfterMerge: true

# =============================================================================
# PR SETTINGS
# =============================================================================

pullRequests:
  # PR title pattern
  # Placeholders: {ticket}, {summary}, {part}
  titlePattern: "{ticket}: {summary}"

  # Template file for PR body (relative to repo root)
  templateFile: ".github/PULL_REQUEST_TEMPLATE.md"

  # Add auto-generated footer to PR description
  addFooter: true

  # Labels to add to created PRs
  labels:
    - automated
    - reorganized

  # Reviewers to request (optional)
  reviewers: []

  # Assign to (optional)
  assignees: []

# =============================================================================
# STATE MANAGEMENT
# =============================================================================

state:
  # State file location
  file: ".pr-resolver-state.json"

  # Checkpoint frequency (after every N operations)
  checkpointFrequency: 1

  # Keep state file after successful completion
  preserveOnSuccess: false

  # State file retention (days) for debugging
  retentionDays: 7

# =============================================================================
# ROLLBACK SETTINGS
# =============================================================================

rollback:
  # Automatically rollback on critical errors
  autoRollbackOnError: true

  # Keep backup branch after successful completion
  preserveBackup: true

  # Backup branch retention (days)
  backupRetentionDays: 30

# =============================================================================
# EDGE CASE HANDLING
# =============================================================================

edgeCases:
  # Max tickets a commit can reference before flagging as "omnibus"
  maxTicketsPerCommit: 3

  # How to handle commits with no ticket reference
  # Options: create_ticket | attach_to_nearest | flag_for_review | ignore
  orphanHandling: flag_for_review

  # How to handle circular dependencies between tickets
  # Options: merge_to_single_pr | flag_for_review
  circularDependencyHandling: merge_to_single_pr

  # How to handle binary files
  # Options: keep_grouped | separate_pr | flag_for_review
  binaryFileHandling: keep_grouped

  # How to handle database migrations
  # Options: dedicated_pr | keep_with_feature | flag_for_review
  migrationHandling: dedicated_pr

# =============================================================================
# LOGGING & REPORTING
# =============================================================================

reporting:
  # Output directory for reports
  outputDir: ".pr-resolver-reports"

  # Generate mapping report (commit -> ticket -> files)
  generateMappingReport: true

  # Generate summary report after completion
  generateSummaryReport: true

  # Generate manual intervention report for flagged items
  generateInterventionReport: true

  # Format for reports
  # Options: markdown | json | html
  format: markdown
