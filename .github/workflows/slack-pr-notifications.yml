name: Slack PR notifications

# Colleagues watch the SCBD GitHub channel for two things only: a pull request
# that is actually waiting on them, and something landing on master. Dev-branch
# churn and agent-driven review PRs are noise to everyone but their author, so
# the base branch is the whole filter -- nothing here keys off who opened the
# PR. Drafts are excluded, which is what keeps agent PRs quiet: they are opened
# as drafts and only announce themselves once a human marks one ready.
#
# NOTE: this workflow is only half the job. The channel is also subscribed to
# the GitHub Slack app, which posts opened/ready/closed for every branch with
# no base filter. Until that subscription is narrowed or dropped for this repo
# (`/github unsubscribe scbd/drupal-module-bioland pulls`), these messages are
# additional to it, not a replacement for it.

on:
  pull_request:
    # `edited` is here for one reason: when a stacked PR's base merges, GitHub
    # retargets the child onto master and emits `edited` -- no `opened` and no
    # `ready_for_review` follows, so without it a PR that just became a master
    # PR is never announced. The job gate below drops every other `edited`
    # (title and body edits) so this does not become a re-notify on every save.
    types: [opened, reopened, ready_for_review, edited, closed]

permissions: {}

jobs:
  notify:
    # Two disjoint cases, and the base-branch test applies to both:
    #   - not yet closed, not a draft  -> a human can review it now
    #   - closed AND merged            -> it landed on master
    # A PR closed without merging, or merged into any branch other than master,
    # falls through and the job never starts.
    #
    # On an `edited` payload without a base change, `changes.base.ref.from`
    # dereferences to null; Actions casts null and '' both to 0 when comparing
    # across types, so the guard is false and a title-only edit stays silent.
    if: >-
      github.event.pull_request.base.ref == 'master' &&
      (
        (github.event.action != 'closed' && !github.event.pull_request.draft &&
          (github.event.action != 'edited' || github.event.changes.base.ref.from != '')) ||
        (github.event.action == 'closed' && github.event.pull_request.merged)
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # secrets is not a context available to job-level or step-level `if`, so
      # the presence check has to round-trip through a step output. Without it
      # a repo that has not been given the webhook -- or any fork PR, which is
      # denied secrets by design -- would show a red X on every master PR.
      - name: Check webhook is configured
        id: webhook
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SLACK_WEBHOOK_URL is unset or withheld from this run (fork PRs cannot read secrets); skipping the Slack notification."
          fi

      # The PR title is the only attacker-controllable string here, and it goes
      # in a plain_text block rather than the mrkdwn one. toJSON keeps the JSON
      # valid, but it does not escape < > &, so a title inside an mrkdwn <url|
      # label> would close the link early and let the rest re-parse as mrkdwn --
      # enough to smuggle in a hyperlink or an <!channel> broadcast. plain_text
      # is not mrkdwn-parsed, so neither renders. The fallback `text` omits the
      # title for the same reason. Everything in the mrkdwn block is either a
      # number or a GitHub login/repo slug, whose charsets cannot reach it.
      - name: Notify Slack -- ready for review
        if: steps.webhook.outputs.configured == 'true' && github.event.action != 'closed'
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          errors: true
          payload: |
            {
              "text": ${{ toJSON(format('Ready for review: {0} #{1}', github.repository, github.event.pull_request.number)) }},
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ${{ toJSON(format(':eyes: *Ready for review* in `{0}` -- <{1}|#{2}> by {3}', github.repository, github.event.pull_request.html_url, github.event.pull_request.number, github.event.pull_request.user.login)) }}
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "plain_text",
                    "emoji": false,
                    "text": ${{ toJSON(github.event.pull_request.title) }}
                  }
                }
              ]
            }

      - name: Notify Slack -- merged to master
        if: steps.webhook.outputs.configured == 'true' && github.event.action == 'closed'
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          errors: true
          payload: |
            {
              "text": ${{ toJSON(format('Merged to master: {0} #{1}', github.repository, github.event.pull_request.number)) }},
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ${{ toJSON(format(':white_check_mark: *Merged to master* in `{0}` -- <{1}|#{2}> by {3}', github.repository, github.event.pull_request.html_url, github.event.pull_request.number, github.event.pull_request.merged_by.login || github.actor)) }}
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "plain_text",
                    "emoji": false,
                    "text": ${{ toJSON(github.event.pull_request.title) }}
                  }
                }
              ]
            }
