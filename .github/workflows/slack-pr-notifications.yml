name: Slack PR notifications

# Colleagues watch the SCBD GitHub channel for two things only: a pull request
# that is actually waiting on them, and something landing on master. Dev-branch
# churn and agent-driven review PRs are noise to everyone but their author, so
# the base branch is the whole filter -- nothing here keys off who opened the
# PR. Drafts are excluded, which is what keeps agent PRs quiet: they are opened
# as drafts and only announce themselves once a human marks one ready.

on:
  pull_request:
    branches: [master]
    types: [ready_for_review, review_requested, closed]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  pull-requests: read

jobs:
  notify:
    # Only notify for non-draft master PR events:
    #   - marked ready, not a draft    -> a human can review it now
    #   - review requested / started   -> announces reviewer starting & remaining capacity
    #   - closed AND merged            -> it landed on master
    #   - review submitted on master   -> review decision / comments to act on
    # GitHub emits closed + merged for merge, squash, and rebase-and-merge.
    # A PR closed without merging, or merged into any branch other than master,
    # falls through and the job never starts.
    if: >-
      github.event.pull_request.base.ref == 'master' &&
      (
        (github.event.action == 'ready_for_review' && !github.event.pull_request.draft) ||
        (github.event.action == 'review_requested' && !github.event.pull_request.draft) ||
        (github.event.action == 'closed' && github.event.pull_request.merged) ||
        (github.event_name == 'pull_request_review' && !github.event.pull_request.draft)
      )
    runs-on: ubuntu-latest
    steps:
      # secrets is not a context available to job-level or step-level `if`, so
      # the presence check has to round-trip through a step output. Without it
      # a repo that has not been given the webhook (a fork, or this repo before
      # an admin adds the secret) shows a red X on every master PR.
      - name: Check webhook is configured
        id: webhook
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SLACK_WEBHOOK_URL is not set; skipping the Slack notification."
          fi

      # Compose Slack notification:
      # - Queries modern rulesets, GraphQL branchProtectionRules, and classic branch protection
      # - Emits rich Block Kit button to start/join review in new tab
      # - Tracks reviewer capacity: indicates when 1 more is needed or no more are needed
      # - Handles reviews: merge suggestion if approved without comments; quoted comment lines if feedback left
      - name: Compose Slack notification
        id: compose
        if: steps.webhook.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE_JSON: ${{ toJSON(github.event.pull_request.title) }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_CREATOR: ${{ github.event.pull_request.user.login }}
          PR_MERGED_BY: ${{ github.event.pull_request.merged_by.login }}
          REQUESTED_REVIEWER: ${{ github.event.requested_reviewer.login }}
          REQUESTED_REVIEWERS_JSON: ${{ toJSON(github.event.pull_request.requested_reviewers) }}
          REVIEW_ID: ${{ github.event.review.id }}
          REVIEW_STATE: ${{ github.event.review.state }}
          REVIEW_BODY_JSON: ${{ toJSON(github.event.review.body) }}
          REVIEW_AUTHOR: ${{ github.event.review.user.login }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          node <<'NODE'
          const https = require('node:https');
          const fs = require('node:fs');

          function escapeSlack(text) {
            if (!text) return '';
            return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
          }

          function githubRequest(options, postData) {
            return new Promise((resolve) => {
              const req = https.request(options, (res) => {
                let data = '';
                res.on('data', chunk => data += chunk);
                res.on('end', () => {
                  try { resolve({ status: res.statusCode, data: JSON.parse(data) }); }
                  catch { resolve({ status: res.statusCode, data: null }); }
                });
              });
              req.on('error', (err) => {
                console.log('[DEBUG] Request error:', err.message);
                resolve({ status: 500, data: null });
              });
              if (postData) req.write(postData);
              req.end();
            });
          }

          function githubApi(path, token) {
            return githubRequest({
              hostname: 'api.github.com',
              path,
              method: 'GET',
              headers: {
                'User-Agent': 'github-actions-slack-notifier',
                'Accept': 'application/vnd.github+json',
                'X-GitHub-Api-Version': '2022-11-28',
                ...(token ? { 'Authorization': `Bearer ${token}` } : {})
              }
            });
          }

          function githubGraphQL(query, variables, token) {
            const postData = JSON.stringify({ query, variables });
            return githubRequest({
              hostname: 'api.github.com',
              path: '/graphql',
              method: 'POST',
              headers: {
                'User-Agent': 'github-actions-slack-notifier',
                'Content-Type': 'application/json',
                'Content-Length': Buffer.byteLength(postData),
                ...(token ? { 'Authorization': `Bearer ${token}` } : {})
              }
            }, postData);
          }

          async function getRequiredReviewers(repo, branch, prNumber, token) {
            const [owner, name] = repo.split('/');

            // 1. Try Repository Rulesets API
            try {
              const rulesRes = await githubApi(`/repos/${repo}/rules/branches/${encodeURIComponent(branch)}`, token);
              if (rulesRes.status === 200 && Array.isArray(rulesRes.data)) {
                const prRule = rulesRes.data.find(r => r.type === 'pull_request');
                if (prRule?.parameters?.required_approving_review_count !== undefined) {
                  console.log('[DEBUG] Detected required reviews via Ruleset:', prRule.parameters.required_approving_review_count);
                  return prRule.parameters.required_approving_review_count;
                }
              }
            } catch (e) {
              console.log('[DEBUG] Ruleset lookup error:', e.message);
            }

            // 2. Try GraphQL branchProtectionRules
            try {
              const gqlRes = await githubGraphQL(`
                query($owner: String!, $name: String!) {
                  repository(owner: $owner, name: $name) {
                    branchProtectionRules(first: 20) {
                      nodes {
                        pattern
                        requiresApprovingReviews
                        requiredApprovingReviewCount
                      }
                    }
                  }
                }
              `, { owner, name }, token);

              const nodes = gqlRes.data?.data?.repository?.branchProtectionRules?.nodes;
              if (Array.isArray(nodes)) {
                const match = nodes.find(n => n.pattern === branch || branch.match(new RegExp('^' + n.pattern.replace(/\*/g, '.*') + '$')));
                if (match && match.requiresApprovingReviews) {
                  const count = match.requiredApprovingReviewCount || 1;
                  console.log('[DEBUG] Detected required reviews via GraphQL branchProtectionRules:', count);
                  return count;
                }
              }
            } catch (e) {
              console.log('[DEBUG] GraphQL branchProtectionRules lookup error:', e.message);
            }

            // 3. Try Classic Branch Protection REST API
            try {
              const protRes = await githubApi(`/repos/${repo}/branches/${encodeURIComponent(branch)}/protection`, token);
              if (protRes.status === 200 && protRes.data?.required_pull_request_reviews) {
                const count = protRes.data.required_pull_request_reviews.required_approving_review_count ?? 1;
                console.log('[DEBUG] Detected required reviews via Classic REST:', count);
                return count;
              }
            } catch (e) {
              console.log('[DEBUG] Classic REST lookup error:', e.message);
            }

            // 4. Fallback heuristic: check PR reviewDecision or branch.protected
            try {
              if (prNumber) {
                const prRes = await githubGraphQL(`
                  query($owner: String!, $name: String!, $number: Int!) {
                    repository(owner: $owner, name: $name) {
                      pullRequest(number: $number) {
                        reviewDecision
                      }
                    }
                  }
                `, { owner, name, number: parseInt(prNumber, 10) }, token);
                const decision = prRes.data?.data?.repository?.pullRequest?.reviewDecision;
                if (decision === 'REVIEW_REQUIRED') {
                  console.log('[DEBUG] Detected review required via PR reviewDecision');
                  return 1;
                }
              }

              const branchRes = await githubApi(`/repos/${repo}/branches/${encodeURIComponent(branch)}`, token);
              if (branchRes.status === 200 && branchRes.data?.protected) {
                console.log('[DEBUG] Detected review required via branch.protected');
                return 1;
              }
            } catch (e) {
              console.log('[DEBUG] Fallback heuristic error:', e.message);
            }

            return null;
          }

          async function getApprovalCount(repo, prNumber, token) {
            try {
              const res = await githubApi(`/repos/${repo}/pulls/${prNumber}/reviews`, token);
              if (res.status === 200 && Array.isArray(res.data)) {
                const latestByUser = new Map();
                for (const r of res.data) {
                  if (r.user?.login && r.state) {
                    latestByUser.set(r.user.login, r.state.toUpperCase());
                  }
                }
                let count = 0;
                for (const state of latestByUser.values()) {
                  if (state === 'APPROVED') count++;
                }
                return count;
              }
            } catch {}
            return 0;
          }

          async function getReviewComments(repo, prNumber, reviewId, token) {
            if (!reviewId) return [];
            try {
              const res = await githubApi(`/repos/${repo}/pulls/${prNumber}/reviews/${reviewId}/comments`, token);
              if (res.status === 200 && Array.isArray(res.data)) {
                return res.data;
              }
            } catch {}
            return [];
          }

          function formatComments(commentList) {
            const maxShown = 5;
            const shown = commentList.slice(0, maxShown);
            const remaining = commentList.length - maxShown;

            const lines = shown.map(comment => {
              const truncated = comment.length > 300 ? comment.slice(0, 297) + '...' : comment;
              return truncated.split(/\r?\n/).map(l => `> ${escapeSlack(l)}`).join('\n');
            });

            if (remaining > 0) {
              lines.push(`> _...and ${remaining} more comment(s) on GitHub_`);
            }

            return lines.join('\n');
          }

          async function run() {
            const token = process.env.GH_TOKEN;
            const repo = process.env.REPOSITORY;
            const branch = process.env.BASE_REF || 'master';
            const eventName = process.env.EVENT_NAME;
            const eventAction = process.env.EVENT_ACTION;
            const prNumber = process.env.PR_NUMBER;
            const prTitle = JSON.parse(process.env.PR_TITLE_JSON || '""');
            const prUrl = process.env.PR_URL;
            const filesUrl = `${prUrl}/files`;
            const creator = process.env.PR_CREATOR;
            const mergedBy = process.env.PR_MERGED_BY;
            const requestedReviewer = process.env.REQUESTED_REVIEWER;
            const requestedReviewers = JSON.parse(process.env.REQUESTED_REVIEWERS_JSON || '[]') || [];
            const reviewId = process.env.REVIEW_ID;
            const reviewState = (process.env.REVIEW_STATE || '').toLowerCase();
            const reviewAuthor = process.env.REVIEW_AUTHOR;
            const reviewBody = JSON.parse(process.env.REVIEW_BODY_JSON || '""') || '';

            const titleLink = `<${prUrl}|#${prNumber} ${escapeSlack(prTitle)}>`;

            const requiredReviews = await getRequiredReviewers(repo, branch, prNumber, token);
            console.log(`[INFO] requiredReviews=${requiredReviews}, eventName=${eventName}, eventAction=${eventAction}`);

            let payload = null;

            // 1. Ready for review
            if (eventName === 'pull_request' && eventAction === 'ready_for_review') {
              const reqText = requiredReviews !== null
                ? (requiredReviews === 1 ? '1 review required' : `${requiredReviews} reviews required`)
                : 'Review required';
              const text = `:eyes: *Ready for review* in \`${repo}\` -- ${titleLink} by ${creator} (${reqText})`;
              payload = {
                text,
                blocks: [
                  {
                    type: 'section',
                    text: {
                      type: 'mrkdwn',
                      text: `:eyes: *Ready for review* in \`${repo}\` -- ${titleLink} by ${creator}\n*Requirement*: ${reqText}`
                    }
                  },
                  {
                    type: 'actions',
                    elements: [
                      {
                        type: 'button',
                        text: { type: 'plain_text', text: 'Start Review :eyes:', emoji: true },
                        url: filesUrl,
                        style: 'primary'
                      }
                    ]
                  }
                ]
              };
            }

            // 2. Someone requested or started review
            else if (eventName === 'pull_request' && eventAction === 'review_requested') {
              const reviewers = (requestedReviewers || []).map(r => r.login || r).filter(Boolean);
              if (requestedReviewer && !reviewers.includes(requestedReviewer)) {
                reviewers.push(requestedReviewer);
              }
              const needed = Math.max(0, (requiredReviews || 1) - reviewers.length);
              const actor = requestedReviewer ? `@${requestedReviewer}` : 'Reviewer';

              if (needed === 0) {
                const text = `:hourglass_flowing_sand: *${actor} started review* in \`${repo}\` -- ${titleLink} (No more reviewers needed)`;
                payload = {
                  text,
                  blocks: [
                    {
                      type: 'section',
                      text: {
                        type: 'mrkdwn',
                        text: `:hourglass_flowing_sand: *${actor} started review* in \`${repo}\` -- ${titleLink}\n*Status*: In review by ${reviewers.map(r => `@${r}`).join(', ')} -- *No more reviewers needed!*`
                      }
                    }
                  ]
                };
              } else {
                const text = `:hourglass_flowing_sand: *${actor} started review* in \`${repo}\` -- ${titleLink} (${needed} more needed)`;
                payload = {
                  text,
                  blocks: [
                    {
                      type: 'section',
                      text: {
                        type: 'mrkdwn',
                        text: `:hourglass_flowing_sand: *${actor} started review* in \`${repo}\` -- ${titleLink}\n*Status*: In review by ${reviewers.map(r => `@${r}`).join(', ')} -- *${needed} more reviewer needed!*`
                      }
                    },
                    {
                      type: 'actions',
                      elements: [
                        {
                          type: 'button',
                          text: { type: 'plain_text', text: 'Join Review :eyes:', emoji: true },
                          url: filesUrl,
                          style: 'primary'
                        }
                      ]
                    }
                  ]
                };
              }
            }

            // 3. Merged to master
            else if (eventName === 'pull_request' && eventAction === 'closed') {
              const text = `:white_check_mark: *Merged to master* in \`${repo}\` -- ${titleLink} by ${mergedBy || creator}`;
              payload = {
                text,
                blocks: [
                  {
                    type: 'section',
                    text: { type: 'mrkdwn', text }
                  }
                ]
              };
            }

            // 4. Review submitted
            else if (eventName === 'pull_request_review') {
              const inlineComments = await getReviewComments(repo, prNumber, reviewId, token);
              const comments = [];
              if (reviewBody.trim()) {
                comments.push(reviewBody.trim());
              }
              for (const c of inlineComments) {
                if (c.body && c.body.trim()) {
                  const loc = c.path ? `\`${c.path}${c.line ? `:${c.line}` : ''}\`: ` : '';
                  comments.push(`${loc}${c.body.trim()}`);
                }
              }

              const totalApprovals = await getApprovalCount(repo, prNumber, token);

              if (reviewState === 'approved') {
                if (comments.length > 0) {
                  const formatted = formatComments(comments);
                  const reqNotice = requiredReviews === 1 ? ' (1 review required)' : (requiredReviews ? ` (${requiredReviews} reviews required)` : '');
                  const text = `:white_check_mark: *Approved with comments* in \`${repo}\` -- ${titleLink} by ${reviewAuthor}${reqNotice}\ncc @${creator} please address comments before merging:\n${formatted}`;
                  payload = {
                    text,
                    blocks: [
                      {
                        type: 'section',
                        text: { type: 'mrkdwn', text }
                      }
                    ]
                  };
                } else {
                  const reqText = requiredReviews !== null
                    ? (requiredReviews === 1 ? '1 review required' : `${totalApprovals}/${requiredReviews} reviews met`)
                    : '';

                  if (requiredReviews === null || requiredReviews <= 1 || totalApprovals >= requiredReviews) {
                    const text = `:white_check_mark: *PR Approved* in \`${repo}\` -- ${titleLink} by ${reviewAuthor}${reqText ? ` (${reqText})` : ''} -- *Ready to merge!* :rocket:`;
                    payload = {
                      text,
                      blocks: [
                        {
                          type: 'section',
                          text: { type: 'mrkdwn', text }
                        }
                      ]
                    };
                  } else {
                    const remaining = requiredReviews - totalApprovals;
                    const text = `:white_check_mark: *Approved* in \`${repo}\` -- ${titleLink} by ${reviewAuthor} (${reqText}) -- ${remaining} more review required before merging`;
                    payload = {
                      text,
                      blocks: [
                        {
                          type: 'section',
                          text: {
                            type: 'mrkdwn',
                            text: `:white_check_mark: *Approved* in \`${repo}\` -- ${titleLink} by ${reviewAuthor} (${reqText})\n*Status*: ${remaining} more review required before merging`
                          }
                        },
                        {
                          type: 'actions',
                          elements: [
                            {
                              type: 'button',
                              text: { type: 'plain_text', text: 'Join Review :eyes:', emoji: true },
                              url: filesUrl,
                              style: 'primary'
                            }
                          ]
                        }
                      ]
                    };
                  }
                }
              } else if (reviewState === 'changes_requested') {
                const formatted = comments.length > 0 ? '\n' + formatComments(comments) : '';
                const text = `:warning: *Changes requested* in \`${repo}\` -- ${titleLink} by ${reviewAuthor}\ncc @${creator} please review requested changes:${formatted}`;
                payload = {
                  text,
                  blocks: [
                    {
                      type: 'section',
                      text: { type: 'mrkdwn', text }
                    }
                  ]
                };
              } else if (reviewState === 'commented') {
                if (comments.length > 0) {
                  const formatted = formatComments(comments);
                  const text = `:speech_balloon: *Review comments* in \`${repo}\` -- ${titleLink} by ${reviewAuthor}\ncc @${creator}:\n${formatted}`;
                  payload = {
                    text,
                    blocks: [
                      {
                        type: 'section',
                        text: { type: 'mrkdwn', text }
                      }
                    ]
                  };
                }
              }
            }

            if (payload) {
              fs.appendFileSync(process.env.GITHUB_OUTPUT, `skip=false\n`);
              fs.appendFileSync(process.env.GITHUB_OUTPUT, `payload_json=${JSON.stringify(payload)}\n`);
            } else {
              fs.appendFileSync(process.env.GITHUB_OUTPUT, `skip=true\n`);
            }
          }

          run().catch((err) => {
            console.error(err);
            process.exit(1);
          });
          NODE

      - name: Notify Slack
        if: steps.webhook.outputs.configured == 'true' && steps.compose.outputs.skip != 'true'
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: ${{ steps.compose.outputs.payload_json }}
