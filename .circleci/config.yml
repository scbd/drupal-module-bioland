version: 2.1

orbs:
  node: circleci/node@5.1.0

executors:
  node_executor:
    docker:
      - image: cimg/node:20.11
    working_directory: ~/project
  php_executor:
    docker:
      - image: cimg/php:8.2
    working_directory: ~/project

commands:
  restore_npm_cache:
    steps:
      - restore_cache:
          name: Restore npm cache
          keys:
            - v1-npm-deps-{{ arch }}-{{ .Branch }}-{{ checksum "package.json" }}
            - v1-npm-deps-{{ arch }}-{{ .Branch }}-
            - v1-npm-deps-
  save_npm_cache:
    steps:
      - save_cache:
          name: Save npm cache
          key: v1-npm-deps-{{ arch }}-{{ .Branch }}-{{ checksum "package.json" }}
          paths:
            - ~/.npm
  restore_composer_cache:
    steps:
      - restore_cache:
          name: Restore composer cache
          keys:
            - v1-composer-{{ arch }}-{{ .Branch }}-{{ checksum "composer.json" }}
            - v1-composer-{{ arch }}-{{ .Branch }}-
            - v1-composer-
  save_composer_cache:
    steps:
      - save_cache:
          name: Save composer cache
          key: v1-composer-{{ arch }}-{{ .Branch }}-{{ checksum "composer.json" }}
          paths:
            - ~/.composer/cache

jobs:
  js-tests:
    executor: node_executor
    steps:
      - checkout
      - restore_npm_cache
      - run:
          name: Install JS dependencies
          command: |
            if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - save_npm_cache
      - run:
          name: Run Jest (CI)
          command: npm run test:ci
      - store_artifacts:
          path: coverage
          when: always
      - store_test_results:
          path: coverage

  php-tests:
    executor: php_executor
    steps:
      - checkout
      - run:
          name: Show PHP version
          command: php -v
      - restore_composer_cache
      - run:
          name: Install Composer dependencies
          command: composer install --no-interaction --prefer-dist --no-progress
      - save_composer_cache
      - run:
          name: Run PHPUnit
          command: ./vendor/bin/phpunit --colors=always
      - store_test_results:
          path: test-results
          when: always

workflows:
  build-and-test:
    jobs:
      - js-tests
      - php-tests