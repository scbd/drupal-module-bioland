version: 2.1

executors:
  node_executor:
    docker:
      - image: cimg/node:20.11
    working_directory: ~/project
  php_executor:
    docker:
      - image: cimg/php:8.2
    working_directory: ~/project

jobs:
  js-tests:
    executor: node_executor
    steps:
      - checkout
      - run:
          name: Node version
          command: node -v
      - restore_cache:
          keys:
            - v1-npm-{{ arch }}-{{ .Branch }}-{{ checksum "package.json" }}
            - v1-npm-{{ arch }}-{{ .Branch }}
            - v1-npm-
      - run:
          name: Install JS dependencies
          command: |
            if [ -f package-lock.json ]; then
              npm ci
            else
              npm install
            fi
      - save_cache:
          key: v1-npm-{{ arch }}-{{ .Branch }}-{{ checksum "package.json" }}
          paths:
            - ~/.npm
      - run:
          name: Prepare test results dirs
          command: mkdir -p test-results/jest coverage
      - run:
          name: Run Jest (CI)
          command: npm run test:ci
      - store_artifacts:
          path: coverage
          when: always
      - store_test_results:
          path: test-results/jest

  php-tests:
    executor: php_executor
    steps:
      - checkout
      - run:
          name: Show PHP version
          command: php -v
      - restore_cache:
          keys:
            - v1-composer-{{ arch }}-{{ checksum "composer.json" }}
            - v1-composer-{{ arch }}
            - v1-composer-
      - run:
          name: Install Composer dependencies
          command: composer install --no-interaction --prefer-dist --no-progress
      - save_cache:
          key: v1-composer-{{ arch }}-{{ checksum "composer.json" }}
          paths:
            - ~/.composer/cache
            - vendor
      - run:
          name: PHP lint
          command: |
            find . -type f \( -name '*.php' -o -name '*.module' -o -name '*.install' -o -name '*.inc' \) -not -path './vendor/*' -not -path './node_modules/*' -print0 | xargs -0 -n 1 php -l
      - run:
          name: Prepare PHP test results dir
          command: mkdir -p test-results/phpunit
      - run:
          name: Run PHPUnit
          command: vendor/bin/phpunit --configuration phpunit.xml.dist --log-junit test-results/phpunit/junit.xml
      - store_test_results:
          path: test-results/phpunit
      - store_artifacts:
          path: test-results/phpunit

workflows:
  build-and-test:
    jobs:
      - js-tests
      - php-tests