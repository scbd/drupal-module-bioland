# Admin styling and prefill behaviour for the mega-menu Component-menu link
# form. Attached only by Drupal\bioland\Service\BiolandComponentMenuFormMode,
# which owns every attach site, so a regular menu link form never loads it.
# Scoped to .bioland-component-menu-form.
component_menu_form:
  css:
    theme:
      css/bioland-component-menu.css: {}
  js:
    js/bioland-component-menu-form-1-1-13.js: {}
  dependencies:
    - core/drupal
    - core/once

# Greys the mega-menu indicator column on the core menu overview screen.
# Attached only by Drupal\bioland\Service\BiolandComponentMenuOverview, and only
# once it has actually spliced the column in. CSS-only; scoped to the
# .bioland-mega-menu-indicator cells that service adds.
menu_overview:
  css:
    theme:
      css/bioland-menu-overview.css: {}

# Aligns the CKEditor 5 editing surface with the public frontend rendering
# (heading sizes + primary-coloured underline). CSS-only; scoped to .ck-content.
ckeditor_content_styles:
  css:
    theme:
      css/bioland.ckeditor.css: {}

# Previews the front-end hero gradient over the field_description CKEditor
# once field_media_image has an image. Attached only on media_hero_add_form
# and media_hero_edit_form by bioland_form_alter(); see
# bioland_hero_editor_preview_settings() for the colour source.
hero_editor_preview:
  css:
    theme:
      css/bioland-hero-editor-preview.css: {}
  js:
    js/bioland-hero-editor-preview-1-1-13.js: {}
  dependencies:
    - core/drupal
    - core/once
    - core/drupalSettings

# BL-917: "Edit image" toggle for the toast image editor bioland places under
# the media image widget (BiolandMediaImageEditor). The editor itself comes
# from toast_image_editor/toast-image-editor-integration, attached alongside.
media_image_editor:
